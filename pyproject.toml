[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corteia-studio"
version = "1.0.0"
description = "CorteIA Studio - editor desktop de cortes automaticos de video com IA (PySide6 + FFmpeg + faster-whisper + OpenCV + PySceneDetect)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [{ name = "CorteIA Studio" }]
keywords = ["video", "editing", "ai", "ffmpeg", "whisper", "subtitles", "shorts", "pyside6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Natural Language :: Portuguese (Brazilian)",
]

# Mirrors requirements.txt (keep the three files in sync; the comment blocks in
# requirements.txt explain every pin). Intentionally WITHOUT pyinstaller
# (requirements-build.txt) and pytest/ruff (requirements-dev.txt).
dependencies = [
    # GUI
    "PySide6==6.12.0",
    # ASR
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.0",
    "av==19.0.2",
    "huggingface-hub==2.4.0",
    "tokenizers==0.23.3",
    "onnxruntime==1.32.0",
    # visao
    "scenedetect==0.7.3",
    "opencv-python-headless>=4.10,<6",
    "numpy>=2.1,<3",
    # midia
    "yt-dlp==2026.10.26",
    "pillow>=10.2",
    # util
    "openai==3.51.0",
    "psutil>=5.9",
    "platformdirs>=4.2",
    "tqdm>=4.66",
    # windows
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7", "pyinstaller-hooks-contrib>=2024.8"]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.4", "black>=24.4"]

[project.scripts]
# `corteia` on PATH after `pip install -e .`. main() returns an int exit code,
# which setuptools propagates through sys.exit().
corteia = "corteia.main:main"

[project.gui-scripts]
# GUI entry point: no console window on Windows (pythonw).
corteia-studio = "corteia.main:main"

[project.urls]
Homepage = "https://github.com/corteia-studio/corteia-studio"
Issues = "https://github.com/corteia-studio/corteia-studio/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Discovery instead of a hard-coded list: an editable install keeps working
# while subpackages are still being created. Only `corteia*` is ever picked up,
# so .venv / build / dist are never collected.
include = ["corteia", "corteia.*"]
namespaces = false

[tool.setuptools.package-data]
corteia = [
    "resources/qss/*.qss",
    "resources/icons/*.png",
    "resources/icons/*.svg",
    "resources/i18n/*.json",
    "resources/models/*.onnx",
]

# --------------------------------------------------------------------------- #
# tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "ffmpeg: tests that need a real ffmpeg/ffprobe on PATH",
    "network: tests that reach an OpenAI-compatible endpoint (skipped by default)",
    "slow: full render / transcription round trips",
]
# Qt is always tested offscreen so `pytest` works in CI and over SSH.
# tests/conftest.py sets os.environ["QT_QPA_PLATFORM"] = "offscreen" before the
# first Qt import; that avoids depending on the pytest-env plugin.

[tool.coverage.run]
source = ["corteia"]
omit = ["corteia/resources/*", "tests/*"]

# --------------------------------------------------------------------------- #
# formatting / linting - the existing sources wrap at ~100 columns
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dist", "build", ".venv", "corteia.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",     # line length is handled by black; long PT-BR strings exist
    "UP006",    # project uses `from __future__ import annotations` everywhere
    "SIM105",   # try/except/pass is used deliberately in filesystem helpers
]

[tool.ruff.lint.per-file-ignores]
"corteia/resources/*" = ["ALL"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  \.venv
| build
| dist
| corteia\.egg-info
)/
'''
