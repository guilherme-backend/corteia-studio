[pytest]
# Configuração própria da suíte de testes. Existe um [tool.pytest.ini_options] no
# pyproject.toml, mas ele não declara o marcador `ui`; o pytest.ini tem precedência
# sobre o pyproject e por isso registramos tudo aqui (sem editar o pyproject).
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    ffmpeg: precisa de ffmpeg/ffprobe reais no PATH
    network: tocaria um endpoint OpenAI-compatible (nunca em CI; sempre mockado)
    slow: render/transcricao completos, acima de ~10 s
    ui: constrói widgets/QApplication offscreen
