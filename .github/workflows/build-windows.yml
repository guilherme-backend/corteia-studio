# =============================================================================
#  Build do instalador Windows — CorteIA Studio
#
#  Gerado em: tag v*  e  aba Actions -> "Build Windows installer" (manual).
#
#  !!! ATENÇÃO: OS ARTEFATOS DESTE WORKFLOW NÃO SÃO ASSINADOS. !!!
#  Nenhum certificado de autenticação de código (OV/EV) é usado aqui, nem no
#  `build_windows.bat`. Consequências práticas, todas reais:
#    * o SmartScreen mostra "O Windows protegeu seu computador / editor
#      desconhecido" na primeira execução de cada nova build (e o reputação de
#      download zera a cada versão, porque cada .exe é um hash diferente);
#    * antivírus (Windows Defender included) são mais agressivos com .exe
#      desconhecidos e não assinados;
#    * o desinstalador (unins000.exe) também fica sem assinatura
#      (`SignedUninstaller=no` em installer/corteia.iss).
#  Assinar é um passo DEPOIS do ISCC, com signtool + timestamp, e exige um
#  comprado. Ver docs/WINDOWS.md -> "SmartScreen e assinatura de código".
#
#  O artefato aqui NUNCA foi testado de fato numa máquina Windows real por
#  ninguém: este workflow prova que compila, não que o app abre e edita vídeo.
#  A lista de verificação manual continua em docs/WINDOWS.md.
# =============================================================================
name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      keep_artifacts_days:
        description: "Quantos dias guardar os artefatos"
        required: false
        default: "30"

# uma build de cada vez por branch/tag; sem cancelamento no meio (é caro)
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest        # Server 2022, x64 — o ALVO é Win10/11 x64
    timeout-minutes: 90

    env:
      APP_NAME: CorteIA Studio     # mesmo name= do EXE()/COLLECT() no spec
      APP_VERSION: 1.0.0           # mesmo MyAppVersion do installer/corteia.iss
      # PyInstaller não faz cross-compile: o host tem que ser Windows.
      PYINSTALLER_WARN_LEVEL: 3

    steps:
      # ---------------------------------------------------------- checkout --
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------ python 3.12 ---
      # PyAV 19.0.2, fixado em requirements.txt, deixou de publicar wheel
      # para Python 3.11. O ambiente de referência e as dependências do app
      # são testados em Python 3.12, que também é >= do piso 3.11 do run.py.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Show build environment
        run: |
          python -VV
          python -m pip --version
          Write-Output "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Output "Arch: $env:PROCESSOR_ARCHITECTURE"

      # ------------------------------------------------------- dependências -
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-build.txt

      # O modelo YuNet é um recurso obrigatório para o rastreamento facial.
      # Alguns clones do repositório não o trazem (arquivo binário .onnx),
      # então o CI o baixa explicitamente antes do PyInstaller.
      - name: Download YuNet face model
        shell: pwsh
        run: |
          $model = "corteia/resources/models/face_detection_yunet_2023mar.onnx"
          $url = "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          New-Item -ItemType Directory -Force -Path (Split-Path $model) | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $model
          if (!(Test-Path $model) -or ((Get-Item $model).Length -lt 100000)) {
            throw "Modelo YuNet ausente ou incompleto: $model"
          }
          Get-Item $model | Select-Object FullName, Length

      - name: Freeze with PyInstaller (one-dir)
        run: |
          # --noconfirm sobrescreve build/ e dist/; o log completo do spec
          # (recursos, DLLs coletadas, resumo pós-Analysis) fica no console.
          pyinstaller corteia.spec --noconfirm --log-level INFO

      - name: Verify the frozen bundle (check_package.py)
        # Falha a CI se faltar qwindows.dll / Qt6*.dll / ctranslate2.dll /
        # DLLs do av / onnxruntime / cv2 / os recursos do app. É a diferença
        # entre "a build passou" e "o app abre".
        run: |
          python scripts/check_package.py "dist/${{ env.APP_NAME }}" --verbose
          if ($LASTEXITCODE -ne 0) {
            throw "check_package.py: bundle incompleto (exit $LASTEXITCODE)"
          }

      - name: Smoke-run the frozen executable (--version)
        # Só `--version`: com console=False não há janela de console, e o
        # `--check` completo precisa de FFmpeg + drivers que a imagem do CI não
        # garante. Prova que o bootloader + PySide6 importam sem DLL faltando.
        continue-on-error: true
        run: |
          $exe = "dist\${{ env.APP_NAME }}\${{ env.APP_NAME }}.exe"
          Start-Process -FilePath $exe -ArgumentList "--version" `
                        -RedirectStandardOutput version.txt `
                        -RedirectStandardError version.err -Wait -NoNewWindow
          Get-Content version.txt, version.err

      # ------------------------------------------------- zip do diretório ----
      - name: Zip the one-dir bundle
        run: |
          Compress-Archive -Path "dist\${{ env.APP_NAME }}\*" `
                           -DestinationPath "dist\${{ env.APP_NAME }}-win64-portable.zip" `
                           -CompressionLevel Optimal
          Get-Item "dist\${{ env.APP_NAME }}-win64-portable.zip" |
            Select-Object Name, @{n="MiB";e={[math]::Round($_.Length/1MB,1)}}

      # artefato NÃO ASSINADO (ver cabeçalho)
      - name: Upload portable bundle (NOT signed)
        uses: actions/upload-artifact@v4
        with:
          name: CorteIA-Studio-${{ env.APP_VERSION }}-win64-portable
          path: dist/${{ env.APP_NAME }}-win64-portable.zip
          if-no-files-found: error
          retention-days: ${{ github.event.inputs.keep_artifacts_days || 30 }}

      # ------------------------------------------------------- Inno Setup ---
      # A URL antiga jrsoftware.org/download.php/is.exe agora redireciona
      # para uma página HTML de downloads, não para um executável. Use o
      # artefato oficial versionado no GitHub e valide tamanho, PE e SHA256.
      - name: Download and install Inno Setup 6 (official URL)
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe"
          $expectedSha256 = "A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C"
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          Write-Output "Baixando Inno Setup 6 de $url"
          curl.exe --fail --location --retry 5 --retry-all-errors --output $installer $url
          if (!(Test-Path $installer) -or ((Get-Item $installer).Length -lt 1000000)) {
            throw "Download do Inno Setup ausente ou muito pequeno."
          }
          $actualSha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Output "SHA256: $actualSha256"
          if ($actualSha256 -ne $expectedSha256) {
            throw "SHA256 inesperado no instalador do Inno Setup."
          }
          $mz = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($installer)[0..1])
          if ($mz -ne "MZ") { throw "O download não é um executável PE válido." }
          # /VERYSILENT sem GUI, /SUPPRESSLICENSES aceita a EULA, /NORESTART
          # não reinicia a máquina, /CURRENTUSER sem elevação.
          $p = Start-Process -FilePath $installer -Wait -NoNewWindow -PassThru `
                             -ArgumentList @(
                               "/VERYSILENT", "/SUPPRESSLICENSES",
                               "/NORESTART", "/CURRENTUSER",
                               "/DIR=$env:LOCALAPPDATA\Programs\Inno Setup 6"
                             )
          if ($p.ExitCode -ne 0) { throw "Instalador do Inno Setup saiu com $($p.ExitCode)" }

      - name: Locate ISCC.exe
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { $found = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          if (-not $found) { throw "ISCC.exe não encontrado depois de instalar o Inno Setup." }
          Write-Output "ISCC: $found"
          & $found /? | Select-Object -First 2
          "path=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # O .iss espera o bundle em dist\CorteIA Studio\ e grava em dist\
      # (SourceDir=.. no próprio arquivo, que mora em installer\).
      - name: Compile installer with ISCC
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.path }}" "installer\corteia.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou com $LASTEXITCODE" }
          Get-Item "dist\CorteIA-Setup-${{ env.APP_VERSION }}.exe" |
            Select-Object FullName, @{n="MiB";e={[math]::Round($_.Length/1MB,1)}}

      # artefato NÃO ASSINADO: SmartScreen vai avisar em quem baixar.
      - name: Upload installer (NOT signed)
        uses: actions/upload-artifact@v4
        with:
          name: CorteIA-Setup-${{ env.APP_VERSION }}-win64
          path: dist/CorteIA-Setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: ${{ github.event.inputs.keep_artifacts_days || 30 }}

      # ------------------------------- (opcional) anexar o .exe a um Release
      # Só quando o gatilho foi uma tag v*. Descomente quando houver um
      # certificado para assinar antes — soltar .exe não assinado num Release
      # público é convite para detecção de antivírus.
      # - name: Attach installer to release
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: dist/CorteIA-Setup-*.exe

      # ------------------------------------------- log do PyInstaller para -
      # --- debug: se o bundle vier incompleto, o warnfile explica o que ----
      - name: Upload PyInstaller warnings (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/corteia/warn-corteia.txt
            build/corteia/xref-corteia.html
          if-no-files-found: ignore
          retention-days: 7
